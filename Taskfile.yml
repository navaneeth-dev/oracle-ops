version: '3'

# Base tasks - all variables provided by overlay files (dev/prod)
vars:
  # Image Factory schematic (system extensions) shared by every cluster.
  TALOS_SCHEMATIC_FILE: '{{.TASKFILE_DIR}}/talos-schematic.yaml'

tasks:
  bootstrap-flux:
    vars:
      CLUSTER_PATH:
        sh: |
          if [ "$TF_VAR_cluster_name" = "rizexor-oracle-dev" ]; then
            echo "rizexor-oracle-dev"
          else
            echo "oracle"
          fi
    cmds:
      - kubectl get ns flux-system || kubectl create ns flux-system
      - |
        kubectl -n flux-system get secret sops-age || kubectl create secret generic sops-age \
          --namespace=flux-system \
          --from-literal=age.agekey="$(infisical secrets get TF_VAR_SOPS_AGEKEY --env=prod --projectId=201b912b-40de-44bf-bb83-ab1bc77554b7 --plain)"
      - |
        infisical run --env=prod --projectId=201b912b-40de-44bf-bb83-ab1bc77554b7 -- flux bootstrap github \
          --owner=navaneeth-dev \
          --repository=oracle-ops \
          --branch=main \
          --personal \
          --read-write-key=true \
          --components-extra="image-reflector-controller,image-automation-controller" \
          --path=k8s/clusters/{{.CLUSTER_PATH}}

  genconfig:
    desc: Generate Talos configuration
    vars:
      # Content-addressed: the factory returns the same ID for the same file.
      TALOS_SCHEMATIC_ID:
        sh: curl -fsS --retry 3 -X POST --data-binary @{{.TALOS_SCHEMATIC_FILE}} https://factory.talos.dev/schematics | jq -er .id
      TALOS_INSTALLER_IMAGE: 'factory.talos.dev/oracle-installer/{{.TALOS_SCHEMATIC_ID}}:{{.TALOS_VERSION}}'
    cmds:
      - sops -d secrets.sops.yaml > secrets.yaml
      - sops -d multidoc/tailscale.sops.yaml > tailscale.yaml
      - |
        talosctl gen config $TF_VAR_cluster_name https://{{.NODE_IP}}:6443 \
          --with-secrets secrets.yaml \
          --kubernetes-version {{.KUBERNETES_VERSION}} \
          --talos-version {{.TALOS_VERSION}} \
          --install-image {{.TALOS_INSTALLER_IMAGE}} \
          --config-patch @patches/cert-approver.yaml \
          --config-patch @patches/oracle-ntp.yaml \
          --config-patch @patches/hostdns.yaml \
          --config-patch @patches/topolvm.yaml \
          --config-patch @patches/scheduling.yaml \
          --config-patch @patches/cilium.yaml \
          --config-patch @multidoc/volume.yaml \
          --config-patch-control-plane @patches/monitoring.yaml \
          --config-patch-control-plane @patches/service-account-issuer.yaml \
          --config-patch @tailscale.yaml --force
      # The node's private IP serves the node itself and admins, who reach it
      # through the Tailscale subnet route the node advertises.
      - talosctl config endpoint {{.NODE_IP}}
      - talosctl config node {{.NODE_IP}}
      - rm -f secrets.yaml tailscale.yaml

  reboot:
    desc: Reboot Talos node
    cmds:
      - talosctl reboot -n {{.NODE_IP}}

  applyconfig:
    desc: Apply Talos configuration
    cmds:
      - talosctl apply-config -f controlplane.yaml -n {{.NODE_IP}}
      - rm controlplane.yaml worker.yaml

  bootstrap:
    desc: Bootstrap Talos cluster
    cmds:
      - talosctl bootstrap -n {{.NODE_IP}}

  upgrade:
    desc: Upgrade Talos cluster
    vars:
      # Content-addressed: the factory returns the same ID for the same file.
      TALOS_SCHEMATIC_ID:
        sh: curl -fsS --retry 3 -X POST --data-binary @{{.TALOS_SCHEMATIC_FILE}} https://factory.talos.dev/schematics | jq -er .id
      TALOS_INSTALLER_IMAGE: 'factory.talos.dev/oracle-installer/{{.TALOS_SCHEMATIC_ID}}:{{.TALOS_VERSION}}'
    cmds:
      - talosctl -n {{.NODE_IP}} upgrade --image {{.TALOS_INSTALLER_IMAGE}} --debug

  upgrade-k8s:
    desc: Upgrade Talos cluster
    cmds:
      - talosctl -n {{.NODE_IP}} upgrade-k8s --to {{.KUBERNETES_VERSION}}

  kubeconfig:
    desc: Get kubeconfig
    cmds:
      - talosctl kubeconfig ./kubeconfig --nodes {{.NODE_IP}} --merge=false --force

  cilium-install:
    desc: Generate Cilium installation manifest (for documentation)
    cmds:
      - |
        helm template \
          cilium \
          cilium/cilium \
          --version 1.20.4 \
          --namespace kube-system \
          --set ipam.mode=kubernetes \
          --set kubeProxyReplacement=false \
          --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
          --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
          --set cgroup.autoMount.enabled=false \
          --set cgroup.hostRoot=/sys/fs/cgroup \
          --set envoy.enabled=false \
          --set hubble.enabled=true \
          --set hubble.relay.enabled=true \
          --set hubble.relay.resources.requests.cpu=100m \
          --set hubble.relay.resources.requests.memory=256Mi \
          --set hubble.relay.resources.limits.memory=256Mi \
          --set hubble.ui.enabled=true \
          --set hubble.ui.backend.resources.requests.cpu=50m \
          --set hubble.ui.backend.resources.requests.memory=128Mi \
          --set hubble.ui.backend.resources.limits.memory=128Mi \
          --set hubble.ui.frontend.resources.requests.cpu=10m \
          --set hubble.ui.frontend.resources.requests.memory=64Mi \
          --set hubble.ui.frontend.resources.limits.memory=64Mi \
          --set operator.replicas=1 > .cilium.yaml
