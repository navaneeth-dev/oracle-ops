# Talos derives the service account issuer and API audiences from the
# control-plane endpoint. Every in-cluster token is bound to the endpoint the
# cluster was created with, https://140.245.250.113:6443, so keep both fixed
# when the endpoint changes. They are identifiers and need not be reachable.
cluster:
  apiServer:
    extraArgs:
      service-account-issuer: https://140.245.250.113:6443
      api-audiences: https://140.245.250.113:6443
