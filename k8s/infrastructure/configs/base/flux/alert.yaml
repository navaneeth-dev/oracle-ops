apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: error-discord-alerts
  namespace: flux-system
spec:
  eventMetadata:
    summary: "Flux error"
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
    - kind: HelmRelease
      name: '*'
      namespace: 'homelab'
    - kind: HelmRelease
      name: '*'
      namespace: 'authentik'
    - kind: HelmRelease
      name: '*'
      namespace: 'cert-manager'
    - kind: HelmRelease
      name: '*'
      namespace: 'envoy-gateway-system'
    - kind: HelmRelease
      name: '*'
      namespace: 'cnpg-system'
    - kind: HelmRelease
      name: '*'
      namespace: 'homepage'
    - kind: HelmRelease
      name: '*'
      namespace: 'kube-system'
    - kind: HelmRelease
      name: '*'
      namespace: 'observability'
    - kind: HelmRelease
      name: '*'
      namespace: 'snapshot-controller'
    - kind: HelmRelease
      name: '*'
      namespace: 'topolvm-system'
    - kind: HelmRelease
      name: '*'
      namespace: 'volsync-system'
