apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
  namespace: observability
  annotations:
    # spec.uid cannot be added to an existing CR; let Flux recreate it.
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  # Stable UID so dashboards survive this CR being recreated.
  uid: VictoriaLogs
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs-server.observability:9428
  plugins:
    - name: victoriametrics-logs-datasource
      # renovate-semver: datasource=custom.grafana-plugins packageName=victoriametrics-logs-datasource
      version: 0.34.0
