apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-extra
  namespace: observability
spec:
  groups:
    # Gaps in the stack's default node-exporter rules. Applies to every
    # node-exporter target, including hostdzire6tb (VMStaticScrape).
    - name: node-extra
      rules:
        - alert: NodeFilesystemReadOnly
          # Only real disk filesystems; Talos bind-mounts many read-only tmpfs.
          expr: >-
            node_filesystem_readonly{job="node-exporter",fstype=~"ext4|xfs|btrfs|zfs"} == 1
            or node_filesystem_device_error{job="node-exporter",fstype=~"ext4|xfs|btrfs|zfs"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is read-only or failing"
            description: >-
              The filesystem is mounted read-only or node-exporter cannot stat
              it. ext4 and xfs go read-only after I/O errors, so writes fail.
        - alert: NodeOOMKill
          # 30m window: node-exporter can stall for minutes during an OOM.
          expr: increase(node_vmstat_oom_kill{job="node-exporter"}[30m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "OOM killer ran on {{ $labels.instance }}"
            description: "The kernel killed {{ $value | printf \"%.0f\" }} process(es) for running out of memory in the last 30 minutes."
        - alert: NodeCPUSteal
          # Both nodes are VMs; steal means the hypervisor is starving them.
          expr: >-
            avg without(cpu) (rate(node_cpu_seconds_total{job="node-exporter",mode="steal"}[5m])) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CPU steal is {{ $value | humanizePercentage }} on {{ $labels.instance }}"
            description: "The hypervisor has withheld over 10% of CPU time for 15 minutes (noisy neighbour or host overcommit)."
