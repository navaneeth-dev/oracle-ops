apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: hostdzire
  namespace: observability
spec:
  # Reuse the stack's node-exporter alerts and dashboards.
  jobName: node-exporter
  targetEndpoints:
    # NixOS node-exporter on the hostdzire6tb NFS VPS,
    # listening only on its Tailscale address.
    - targets:
        - 100.124.57.7:9100
      labels:
        node: hostdzire
