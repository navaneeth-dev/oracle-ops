---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: http-client-ip-detection
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: reverse-proxy
  clientIPDetection:
    xForwardedFor:
      # The OCI Network Load Balancer is layer 4 and preserves the client source
      # IP, so every X-Forwarded-For entry comes from the client.
      numTrustedHops: 0
