---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: topolvm-instance
  path: ./k8s/infrastructure/controllers/base/crowdsec/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  # No postBuild substitution: the CrowdSec values contain ${REGISTRATION_TOKEN},
  # which the chart resolves at runtime.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
