---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: crowdsec
      version: 0.24.3
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  values:
    container_runtime: containerd

    config:
      config.yaml.local: |
        api:
          client:
            unregister_on_exit: true
          server:
            auto_registration:
              enabled: true
              token: "${REGISTRATION_TOKEN}"
              allowed_ranges:
                - "127.0.0.1/32"
                - "10.0.0.0/8"
        db_config:
          flush:
            agents_autodelete:
              login_password: 6h
              cert: 6h

    lapi:
      # One replica with persistent SQLite state for these single-node clusters.
      replicas: 1
      persistentVolume:
        data:
          enabled: true
          storageClassName: topolvm-provisioner-thin
          size: 1Gi
        config:
          enabled: true
          storageClassName: topolvm-provisioner-thin
          size: 100Mi
      env:
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-keys
              key: ENROLL_KEY
        - name: ENROLL_INSTANCE_NAME
          value: oracle-prod
        - name: ENROLL_TAGS
          value: oracle
        - name: BOUNCER_KEY_envoy
          valueFrom:
            secretKeyRef:
              name: crowdsec-keys
              key: BOUNCER_KEY_envoy
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: null
          memory: 256Mi

    agent:
      acquisition:
        - namespace: envoy-gateway-system
          podName: envoy-envoy-gateway-system-reverse-proxy-*
          program: envoy
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: null
          memory: 256Mi

    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: 0.0.0.0:7422
          path: /
          appsec_configs:
            - crowdsecurity/appsec-default
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: null
          memory: 512Mi

  # Agent and AppSec pods keep their names across a node reboot, so the chart's
  # init container registers the same machine name again and LAPI rejects it
  # with "user already exist" (crowdsecurity/helm-charts#252). autodelete never
  # removes machines that own alerts, and unregister_on_exit loses the race
  # when LAPI stops first on the same node. Reuse the credentials kept in the
  # pod's emptyDir while they still log in, as in helm-charts#361. Drop this
  # once the chart registers idempotently.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              name: crowdsec-(agent|appsec)
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crowdsec
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-lapi-and-register
                        command:
                          - sh
                          - -c
                          - |
                            set -eu
                            until nc "$LAPI_HOST" "$LAPI_PORT" -z; do
                              echo waiting for lapi to start
                              sleep 5
                            done
                            ln -s /staging/etc/crowdsec /etc/crowdsec
                            saved=/tmp_config/local_api_credentials.yaml
                            if [ -f "$saved" ] &&
                              grep -qx "login: $USERNAME" "$saved"; then
                              cp "$saved" /etc/crowdsec/
                              if cscli lapi status; then
                                echo "reusing LAPI credentials for $USERNAME"
                                exit 0
                              fi
                              rm -f /etc/crowdsec/local_api_credentials.yaml
                            fi
                            cscli lapi register --machine "$USERNAME" \
                              -u "$LAPI_URL" --token "$REGISTRATION_TOKEN"
                            cp /etc/crowdsec/local_api_credentials.yaml "$saved"
