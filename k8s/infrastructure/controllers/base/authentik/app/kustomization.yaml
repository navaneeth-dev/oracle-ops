---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backendtrafficpolicy.yaml
  - secret.yaml
  - objectstore.yaml
  - secret-authentik.yaml
  - secret-smtp.yaml
  - secret-blueprint-silo.yaml
  - cluster.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - role.yaml
  - rolebinding.yaml
  - scheduledbackup.yaml
configMapGenerator:
  - name: authentik-blueprint-passkey
    namespace: authentik
    files:
      - passkey-login.yaml
      - passkey-invitation.yaml
  - name: authentik-email-templates
    namespace: authentik
    files:
      - passkey-enrollment.html
generatorOptions:
  disableNameSuffixHash: true
