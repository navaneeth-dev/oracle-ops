version: 1
metadata:
  name: Homelab passkey sign-in
entries:
  - model: authentik_flows.flow
    id: passkey-flow
    identifiers:
      slug: passkey-sign-in
    attrs:
      name: Passkey sign-in
      title: Sign in with your passkey
      designation: authentication
      authentication: require_unauthenticated
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passkey-validation
    identifiers:
      name: passkey-sign-in-validation
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny
      webauthn_user_verification: required
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !KeyOf passkey-validation
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields: [email, username]
      passwordless_flow: !KeyOf passkey-flow
