version: 1
metadata:
  name: Homelab passkey sign-in
entries:
  - model: authentik_flows.flow
    id: passkey-flow
    identifiers:
      slug: passkey-sign-in
    attrs:
      name: Passkey sign-in
      title: Sign in with your passkey
      designation: authentication
      authentication: require_unauthenticated
  # Asking for the username first lets authentik name the user's passkeys in
  # the WebAuthn request instead of relying on the authenticator to list
  # discoverable ones.
  - model: authentik_stages_identification.identificationstage
    id: passkey-identification
    identifiers:
      name: passkey-sign-in-identification
    attrs:
      user_fields: [email, username]
      pretend_user_exists: true
      show_matched_user: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !KeyOf passkey-identification
      order: 5
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passkey-validation
    identifiers:
      name: passkey-sign-in-validation
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny
      webauthn_user_verification: required
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !KeyOf passkey-validation
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: passkey-setup
    identifiers:
      name: default-authenticator-webauthn-setup
    attrs:
      friendly_name: Passkey
      # Discoverable credentials are what let the passkey flow skip the username.
      resident_key_requirement: required
      user_verification: required
  # The bundled password flow stays reachable by URL, so it must never be a
  # way to enroll a passkey with only a password.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny
      configuration_stages: []
      webauthn_user_verification: required
  # Reached only through a recovery link that an admin emails from the user's
  # page, which is how new users and users who lost their passkey enroll.
  - model: authentik_flows.flow
    id: passkey-enrollment-flow
    identifiers:
      slug: passkey-enrollment
    attrs:
      name: Passkey enrollment
      title: Set up your passkey
      designation: recovery
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-enrollment-flow
      stage: !KeyOf passkey-setup
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-enrollment-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_authentication: !KeyOf passkey-flow
      flow_recovery: !KeyOf passkey-enrollment-flow
  - model: authentik_brands.brand
    identifiers:
      domain: authentik.oci.fossindia.ovh
    attrs:
      flow_authentication: !KeyOf passkey-flow
      flow_recovery: !KeyOf passkey-enrollment-flow
  # The bundled "Default - TOTP MFA setup flow" and "Default - Static MFA setup
  # flow" blueprints are disabled in authentik itself; a blueprint cannot
  # disable another one, and they would recreate what is removed below.
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    state: absent
    identifiers:
      name: default-authenticator-totp-setup
  - model: authentik_flows.flow
    state: absent
    identifiers:
      slug: default-authenticator-totp-setup
  - model: authentik_stages_authenticator_static.authenticatorstaticstage
    state: absent
    identifiers:
      name: default-authenticator-static-setup
  - model: authentik_flows.flow
    state: absent
    identifiers:
      slug: default-authenticator-static-setup
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields: [email, username]
      passwordless_flow: !KeyOf passkey-flow
