# prettier-ignore
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  chart:
    spec:
      chart: authentik
      version: 2026.8.6
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  timeout: 10m0s
  interval: 1h0m0s

  values:
    fullnameOverride: authentik

    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-app
              key: password
      envFrom:
        - secretRef:
            name: authentik-secrets
        - secretRef:
            name: authentik-smtp
      volumes:
        - name: email-templates
          configMap:
            name: authentik-email-templates
      volumeMounts:
        - name: email-templates
          mountPath: /templates
          readOnly: true

    blueprints:
      configMaps:
        - authentik-blueprint-passkey
      secrets:
        - authentik-blueprint-silo

    server:
      route:
        main:
          enabled: true
          hostnames:
            - 'authentik.${DOMAIN}'
          parentRefs:
            - kind: Gateway
              name: reverse-proxy
              namespace: envoy-gateway-system
