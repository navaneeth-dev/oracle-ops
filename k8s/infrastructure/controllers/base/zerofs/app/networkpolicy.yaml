apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zerofs-gateway
  namespace: zerofs
spec:
  podSelector:
    matchLabels:
      app: zerofs-gateway
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 5564
      protocol: TCP
    from:
    - podSelector:
        matchLabels:
          app: zerofs-csi-node
  - ports:
    - port: 7000
      protocol: TCP
    from:
    - podSelector:
        matchLabels:
          app: zerofs-csi-controller
