apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerofs-csi-controller
  namespace: zerofs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zerofs-csi-controller
  template:
    metadata:
      labels:
        app: zerofs-csi-controller
    spec:
      serviceAccountName: zerofs-csi-controller
      containers:
      - name: zerofs-csi
        image: ghcr.io/barre/zerofs-csi@sha256:89f99a1c9bfaaebe3cfa405c773e9894dd8553015fbc21002094fb614a1cf1bd
        args:
        - --mode=controller
        - --endpoint=unix:///csi/csi.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 64Mi
      - name: csi-provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
        args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 64Mi
      volumes:
      - name: socket-dir
        emptyDir: {}
