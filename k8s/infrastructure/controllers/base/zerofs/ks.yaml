apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zerofs
  namespace: flux-system
spec:
  interval: 1h
  path: ./k8s/infrastructure/controllers/base/zerofs/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 10m
  dependsOn:
  - name: topolvm
  decryption:
    provider: sops
    secretRef:
      name: sops-age
