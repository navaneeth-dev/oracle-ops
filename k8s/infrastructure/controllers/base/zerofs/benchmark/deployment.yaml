apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerofs-benchmark
  namespace: zerofs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zerofs-benchmark
  template:
    metadata:
      labels:
        app: zerofs-benchmark
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: permissions
        image: python:3.13-slim-bookworm@sha256:e32be0e55814a08977501ca863271d9bd02443710db8f2afaf8372e2c4508530
        command:
        - python
        - -c
        - import os; os.chown("/data", 1000, 1000); os.chmod("/data", 0o775)
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: benchmark
        image: python:3.13-slim-bookworm@sha256:e32be0e55814a08977501ca863271d9bd02443710db8f2afaf8372e2c4508530
        command:
        - python
        - -c
        - import signal; signal.pause()
        securityContext: &id001
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources: &id002
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts: &id003
        - name: data
          mountPath: /data
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /tmp
      - name: fio
        image: longhornio/kbench@sha256:1e330d90a1ec1f847746443ead7ec5e600b2c0f8c5ceca4d9f8db357221934d8
        command:
        - /bin/sh
        - -c
        - exec sleep infinity
        securityContext: *id001
        resources: *id002
        volumeMounts: *id003
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zerofs-benchmark
      - name: script
        configMap:
          name: zerofs-benchmark
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
