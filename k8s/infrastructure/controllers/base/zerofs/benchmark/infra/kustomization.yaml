apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../app
patches:
  # Temporary scheduler reservation for the manually applied trial only.
  # The GitOps app uses 250m after the CPU-sizing changes are rolled out.
  - target:
      kind: StatefulSet
      name: zerofs-gateway-.*
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
