# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
    namespace: observability
  releaseName: stack
  values:
    fullnameOverride: stack

    defaultRules:
      rules:
        KubeClientCertificateExpiration:
          spec:
            # Ignore brief bursts of Talos's temporary client certificates during backups.
            for: 15m
      groups:
        kubeScheduler:
          create: false
        kube-prometheus-general.rules:
          rules:
            # count(up == 0) is empty while every target is up, which trips RecordingRulesNoData
            count:up0:
              enabled: false

    external:
      grafana:
        host: "grafana.${DOMAIN}"

    defaultDashboards:
      defaultTimezone: ist
      grafanaOperator:
        enabled: true

    defaultDatasources:
      grafanaOperator:
        enabled: true

    grafana:
      enabled: false
      forceDeployDatasource: true

    vmsingle:
      enabled: true
      spec:
        resources:
          limits:
            cpu: 1200m
            memory: 1500Mi
          requests:
            cpu: 150m
            memory: 1500Mi
        extraArgs:
          opentelemetry.usePrometheusNaming: "true"

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: { type: RuntimeDefault }

    vmalert:
      spec:
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 128Mi
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi

    vmagent:
      spec:
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
        resources:
          limits:
            memory: 320Mi
          requests:
            cpu: 100m
            memory: 320Mi

    kube-state-metrics:
      vmScrape:
        enabled: true
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "kube-state-metrics.name" (index .Subcharts "kube-state-metrics") }}'
              app.kubernetes.io/instance: '{{ include "vm.release" . }}'
          endpoints:
            - port: http
              honorLabels: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
          jobLabel: app.kubernetes.io/name
      # For kube-prometheus-stacks that are already installed and configured with
      # custom collectors, commenting out the collectors and extraArgs below will
      # retain any existing kube-state-metrics configuration.
#      collectors: [ ]
#      extraArgs:
#        - --custom-resource-state-only=true
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: [ "list", "watch" ]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, lastAppliedRevision ]
                      source_name: [ spec, sourceRef, name ]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, history, "0", chartVersion ]
                      chart_name: [ status, history, "0", chartName ]
                      chart_app_version: [ status, history, "0", appVersion ]
                      chart_ref_name: [ spec, chartRef, name ]
                      chart_source_name: [ spec, chart, spec, sourceRef, name ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      endpoint: [ spec, endpoint ]
                      bucket_name: [ spec, bucketName ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      chart_name: [ spec, chart ]
                      chart_version: [ spec, version ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      suspended: [ spec, suspend ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      suspended: [ spec, suspend ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      webhook_path: [ status, webhookPath ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      image: [ spec, image ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      source_name: [ spec, imageRepositoryRef, name ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      source_name: [ spec, sourceRef, name ]
      enabled: true

    kubelet:
      enabled: true

    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              # apiserver histograms exceed vmagent's 16MiB default.
              max_scrape_size: 32MiB

    kubeProxy:
      enabled: false

    coreDns:
      enabled: true

    kubeControllerManager:
      enabled: true
      service:
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeScheduler:
      enabled: true
      service:
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    alertmanager:
      enabled: true
      templateFiles:
        discord.tmpl: |-
          {{/* Shared by every discord_configs receiver. */}}
          {{ define "discord.emoji" -}}
          {{ if eq . "critical" }}🔥{{ else if eq . "warning" }}⚠️{{ else if eq . "info" }}ℹ️{{ else }}❔{{ end }}
          {{- end }}

          {{/* Embed title, e.g. "⚠️ FIRING · 4 alerts in kubernetes-apps · observability". */}}
          {{ define "discord.title" -}}
          {{- $severity := "" -}}
          {{- range .Alerts.Firing -}}
            {{- if eq .Labels.severity "critical" -}}{{ $severity = "critical" }}
            {{- else if and (eq .Labels.severity "warning") (ne $severity "critical") -}}{{ $severity = "warning" }}
            {{- else if eq $severity "" -}}{{ $severity = .Labels.severity }}
            {{- end -}}
          {{- end -}}
          {{- $count := len .Alerts -}}
          {{- if eq .Status "firing" -}}
            {{ template "discord.emoji" $severity }} FIRING
            {{- $count = len .Alerts.Firing -}}
          {{- else -}}
            ✅ RESOLVED
          {{- end }} ·
          {{- if .CommonLabels.alertname }} {{ .CommonLabels.alertname }}{{ if gt $count 1 }} ×{{ $count }}{{ end }}
          {{- else }} {{ $count }} alerts{{ with .CommonLabels.alertgroup }} in {{ . }}{{ end }}
          {{- end }}
          {{- with .CommonLabels.namespace }} · {{ . }}{{ end }}
          {{- end }}

          {{/* vmalert's Grafana Explore links contain raw JSON; encode it so Discord keeps the link. */}}
          {{ define "discord.url" -}}
          {{ . | reReplaceAll "\"" "%22" | reReplaceAll "[{]" "%7B" | reReplaceAll "[}]" "%7D" | reReplaceAll "\\[" "%5B" | reReplaceAll "\\]" "%5D" }}
          {{- end }}

          {{/*
            Upstream rule descriptions end in "on cluster <cluster>", but our series have no cluster label.
            Resources named "<namespace>/<name>" are shown as inline code.
          */}}
          {{ define "discord.text" -}}
          {{- $text := or .Annotations.description .Annotations.summary | reReplaceAll " on cluster  " " " | reReplaceAll " on cluster [.]" "." -}}
          {{- with .Labels.namespace }}{{ $text = reReplaceAll (printf "(%s/[a-z0-9]([-.a-z0-9]*[a-z0-9])?)" .) "`$1`" $text }}{{ end -}}
          {{ $text }}
          {{- end }}

          {{ define "discord.alert" -}}
          {{ if eq .Status "firing" }}{{ template "discord.emoji" .Labels.severity }}{{ else }}✅{{ end }} **{{ .Labels.alertname }}** · {{ if eq .Status "firing" }}since <t:{{ .StartsAt.Unix }}:R>{{ else }}resolved <t:{{ .EndsAt.Unix }}:R>{{ end }}
          {{ template "discord.text" . }}
          [Graph]({{ template "discord.url" .GeneratorURL }}){{ with .Annotations.runbook_url }} · [Runbook]({{ . }}){{ end }}
          {{- end }}

          {{ define "discord.message" -}}
          {{- $first := true -}}
          {{- range .Alerts.Firing -}}
            {{ if not $first }}{{ "\n\n" }}{{ end }}{{ $first = false }}{{ template "discord.alert" . }}
          {{- end -}}
          {{- range .Alerts.Resolved -}}
            {{ if not $first }}{{ "\n\n" }}{{ end }}{{ $first = false }}{{ template "discord.alert" . }}
          {{- end -}}
          {{- end }}
      spec:
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 30m
            memory: 64Mi
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
      config:
        route:
          receiver: "discord-infra"
          group_by: ["alertgroup", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: 'healthchecksio'
              matchers:
                - alertname =~ "InfoInhibitor|Watchdog"

        receivers:
          - name: "discord-infra"
            discord_configs:
              - webhook_url: 'replacedfromvalues'
                username: '${DOMAIN}'
                title: '{{ template "discord.title" . }}'
                message: '{{ template "discord.message" . }}'
          - name: "null"
          - name: "discord-info"
            discord_configs:
              - webhook_url: 'replacedfromvalues'
                username: '${DOMAIN}'
                title: '{{ template "discord.title" . }}'
                message: '{{ template "discord.message" . }}'
          - name: "healthchecksio"
            webhook_configs:
              - url: 'replacedfromvalues'
                # dont send resolved alerts to healthchecks.io
                send_resolved: false
  valuesFrom:
    - kind: Secret
      name: discord-webhook
      valuesKey: token
      targetPath: alertmanager.config.receivers[0].discord_configs[0].webhook_url
    - kind: Secret
      name: discord-webhook
      valuesKey: info
      targetPath: alertmanager.config.receivers[2].discord_configs[0].webhook_url
    - kind: Secret
      name: alertmanager
      valuesKey: HEALTH_CHECKS_IO_URL
      targetPath: alertmanager.config.receivers[3].webhook_configs[0].url
