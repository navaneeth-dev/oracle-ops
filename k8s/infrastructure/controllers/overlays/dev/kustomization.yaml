apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Victoria Metrics dev secrets
  - dev-secrets/victoria-metrics-alertmanager.yaml
  - dev-secrets/victoria-metrics-discord-webhook.yaml

patches:
  # Authentik dev serverName via Flux Kustomization patches
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: authentik
        namespace: flux-system
      spec:
        patches:
          - patch: |-
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: authentik
                namespace: authentik
              spec:
                plugins:
                  - name: barman-cloud.cloudnative-pg.io
                    isWALArchiver: true
                    parameters:
                      barmanObjectName: ovhcloud
                      serverName: authentik-dev
            target:
              kind: Cluster
              name: authentik
              namespace: authentik
    target:
      kind: Kustomization
      name: authentik
      namespace: flux-system
  # Keep the standalone dev writer isolated from production object data.
  - target:
      kind: Kustomization
      name: zerofs
      namespace: flux-system
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: zerofs
        namespace: flux-system
      spec:
        patches:
          - target:
              kind: ConfigMap
              name: zerofs-gateway-a-config
              namespace: zerofs
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: zerofs-gateway-a-config
                namespace: zerofs
              data:
                backend: s3://rizexor-media/zerofs-dev
          - target:
              kind: StatefulSet
              name: zerofs-gateway-a
              namespace: zerofs
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: zerofs-gateway-a
                namespace: zerofs
              spec:
                template:
                  metadata:
                    annotations:
                      zerofs.net/backend: rizexor-media/zerofs-dev
