apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Victoria Metrics secrets
  - prod-secrets/victoria-metrics-alertmanager.yaml
  - prod-secrets/victoria-metrics-discord-webhook.yaml

patches:
  # A unique object prefix is required for each independent cluster writer.
  - target:
      kind: Kustomization
      name: zerofs
      namespace: flux-system
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: zerofs
        namespace: flux-system
      spec:
        postBuild:
          substitute:
            ZEROFS_STORAGE_URL: s3://rizexor-media/zerofs
