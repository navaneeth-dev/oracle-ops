apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base/arr-stack
- ../base/librespeed
- ../base/homepage
- secret-wireguard.yaml
- arr-zerofs
patches:
- target:
    kind: Kustomization
    name: ^(qbittorrent|sonarr|radarr)$
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: _
    spec:
      dependsOn:
      - name: arr-zerofs-storage
      patches:
      - target:
          kind: HelmRelease
        patch: |
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: _
          spec:
            values:
              persistence:
                zerofs:
                  enabled: true
                  type: persistentVolumeClaim
                  existingClaim: arr-zerofs
                  globalMounts:
                  - path: /zerofs
- target:
    kind: Kustomization
    name: qbittorrent
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: qbittorrent
      namespace: flux-system
    spec:
      healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: qbittorrent
        namespace: homelab
- target:
    kind: Kustomization
    name: sonarr
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: sonarr
      namespace: flux-system
    spec:
      healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: sonarr
        namespace: homelab
- target:
    kind: Kustomization
    name: radarr
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: radarr
      namespace: flux-system
    spec:
      healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: radarr
        namespace: homelab
