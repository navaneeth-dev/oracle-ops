apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arr-zerofs-storage
  namespace: flux-system
spec:
  interval: 1h
  path: ./k8s/apps/oracle/arr-zerofs/storage
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
  - name: zerofs
  prune: false
  wait: true
  timeout: 15m
