---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  docker.yaml: ""

  kubernetes.yaml: |
    mode: disabled
    gateway: false
    ingress: false
    traefik: false

  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: false
    fiveColumns: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
      hideVisitURL: true
    layout:
      Streaming:
        style: row
        columns: 4
      Media Automation:
        style: row
        columns: 4
      Tools:
        style: row
        columns: 4

  widgets.yaml: |
    - logo:
        icon: https://cdn.fossindia.ovh/fossindia.png
    - greeting:
        text_size: md
        text: Status Page ↗
        href: https://status.fossindia.ovh

  bookmarks.yaml: ""

  services.yaml: |
    - Streaming:
        - Emby:
            href: 'https://emby.${DOMAIN}'
            icon: emby
            description: Watch Movies/TV
        - Audiobookshelf:
            href: 'https://audiobookshelf.${DOMAIN}'
            icon: audiobookshelf
            description: Stream Audiobooks
        - Seer:
            href: 'https://requests.${DOMAIN}'
            icon: jellyseerr
            description: Download Movies/TV

    - Media Automation:
        - Prowlarr:
            href: 'https://prowlarr.${DOMAIN}'
            icon: prowlarr
        - Radarr:
            href: 'https://radarr.${DOMAIN}'
            icon: radarr
        - Sonarr:
            href: 'https://sonarr.${DOMAIN}'
            icon: sonarr
        - Sonarr Anime:
            href: 'https://sonarr-anime.${DOMAIN}'
            icon: sonarr
        - qBittorrent:
            href: 'https://qbittorrent.${DOMAIN}'
            icon: qbittorrent
        - Qui:
            href: 'https://qui.${DOMAIN}'
            icon: qbittorrent

    - Tools:
        - Authentik:
            href: 'https://authentik.${DOMAIN}'
            icon: authentik
        - Speedtest:
            href: 'https://speed.${DOMAIN}'
            icon: librespeed
        - Grafana:
            href: 'https://grafana.${DOMAIN}'
            icon: grafana
