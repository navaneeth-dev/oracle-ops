kind: VMProbe
apiVersion: operator.victoriametrics.com/v1beta1
metadata:
  name: qui
  namespace: homelab
spec:
  interval: "30s"
  module: http_2xx
  jobName: qui
  vmProberSpec:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
    scheme: http
  targets:
    staticConfig:
      targets:
        - http://qui.homelab.svc.cluster.local:7476/healthz/readiness
      labels:
        name: Qui
        category: Arr Suite
