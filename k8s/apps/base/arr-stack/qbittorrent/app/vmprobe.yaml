kind: VMProbe
apiVersion: operator.victoriametrics.com/v1beta1
metadata:
  name: qbittorrent
  namespace: homelab
spec:
  interval: "30s"
  module: http_2xx
  jobName: qbittorrent
  vmProberSpec:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
    scheme: http
  targets:
    staticConfig:
      targets:
        # qBittorrent on hostdzire6tb, over Tailscale.
        - http://100.124.57.7:8080/api/v2/app/version
      labels:
        name: qBittorrent
        category: Arr Suite
