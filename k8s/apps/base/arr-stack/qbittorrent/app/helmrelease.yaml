# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
# qBittorrent itself runs on hostdzire6tb (nixos/hosts/hostdzire/qbittorrent.nix).
# This pod is now only gluetun, kept as the HTTP proxy that Sonarr and Radarr
# use to reach the internet through the WireGuard VPS, until they move off it
# (docs/operations/qbittorrent-hostdzire.md, step 7).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name qbittorrent
  namespace: homelab
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        pod:
          securityContext:
            seccompProfile: { type: RuntimeDefault }
        containers:
          gluetun:
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 512Mi
            image:
              repository: qmcgaw/gluetun
              tag: v3.41.3
            # The only privileged-level exception in homelab: gluetun must run
            # as root with NET_ADMIN to create the WireGuard interface, routes
            # and kill-switch firewall rules. Every other capability is dropped.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["NET_ADMIN"]
            envFrom:
              - secretRef:
                  name: wireguard-secrets
            env:
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              # The tunnel carries no IPv6, so route only IPv4 through it.
              WIREGUARD_ALLOWED_IPS: "0.0.0.0/0"

              FIREWALL_OUTBOUND_SUBNETS: "10.244.0.0/16,10.96.0.0/12"
              FIREWALL_INPUT_PORTS: "8888"

              HTTPPROXY: "on"
              # Without DAC_OVERRIDE and CHOWN, gluetun cannot use its 0644
              # /tmp/gluetun directory or chown files to the default UID 1000.
              PUBLICIP_FILE: /tmp/gluetun-ip
              PUID: "0"
              PGID: "0"
    service:
      app:
        primary: true
        controller: *name
        ports:
          proxy:
            port: 8888

    persistence:
      tmp:
        type: emptyDir
