apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr
  namespace: homelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
      app.kubernetes.io/instance: prowlarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Radarr and Sonarr search through Prowlarr's per-indexer endpoints.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: radarr
              app.kubernetes.io/instance: radarr
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sonarr
              app.kubernetes.io/instance: sonarr
        # Radarr and Sonarr use gluetun's HTTP proxy (port 8888), so their
        # requests arrive from the qbittorrent pod.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qbittorrent
              app.kubernetes.io/instance: qbittorrent
        # authentik's embedded proxy outpost serves the Prowlarr web UI.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-blackbox-exporter
              app.kubernetes.io/instance: blackbox-exporter
      ports:
        - protocol: TCP
          port: 9696
