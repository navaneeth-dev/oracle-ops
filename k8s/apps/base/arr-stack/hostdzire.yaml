apiVersion: v1
kind: PersistentVolume
metadata:
  name: hostdzire
spec:
  capacity:
    storage: 900Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: hostdzire
    namespace: homelab
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
  nfs:
    server: 100.125.227.18
    path: ${HOSTDZIRE_EXPORT_PATH}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostdzire
  namespace: homelab
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: hostdzire
  resources:
    requests:
      storage: 900Gi
