kind: VMProbe
apiVersion: operator.victoriametrics.com/v1beta1
metadata:
  name: silo
  namespace: homelab
spec:
  interval: "30s"
  module: http_2xx
  jobName: silo
  vmProberSpec:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
    scheme: http
  targets:
    staticConfig:
      targets:
        - http://silo.homelab.svc.cluster.local:8080/api/v1/health
      labels:
        name: Silo
        category: Media
