# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name librespeed
  namespace: homelab
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      librespeed:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 33 # www-data
            runAsGroup: 33
            fsGroup: 33
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/librespeed/speedtest
              tag: latest@sha256:c0b5192262a5cdf8802fd0d0876aa4909789c3db5799b987aeed5515ae0faf16
            env:
              MODE: standalone
              # Keep the image's Listen 80; the entrypoint can only rewrite
              # /etc/apache2 as root. Pods may bind low ports unprivileged.
              WEBPORT: "80"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &containerPort 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  initialDelaySeconds: 2
                  failureThreshold: 24
                  periodSeconds: 5
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        primary: true
        controller: *name
        ports:
          http:
            port: 8080
            targetPort: *containerPort

    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - kind: Gateway
            name: reverse-proxy
            namespace: envoy-gateway-system
        hostnames:
          - 'speed.${DOMAIN}'

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /var/www/html
            subPath: html
          - path: /var/run/apache2
            subPath: run
          - path: /var/lock/apache2
            subPath: lock
          - path: /tmp
            subPath: tmp
