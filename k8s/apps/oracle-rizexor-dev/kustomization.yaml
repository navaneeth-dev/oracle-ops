apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/arr-stack
  - ../base/librespeed
  - ../base/homepage
#  - ./backstage/ocirepository.yaml
#  - ./backstage/ks.yaml
  - ./kro
  - backstage.yaml
  - backstage-secret.yaml
  - image-update/test.yaml
  - secret-wireguard.yaml
# ZeroFS infrastructure and the shared media claim are enabled only on Oracle.
patches:
  - target:
      kind: Kustomization
      name: ^(qbittorrent|sonarr|radarr)$
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        patches:
          - target:
              kind: HelmRelease
            patch: |
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: _
              spec:
                values:
                  persistence:
                    zerofs:
                      enabled: false
