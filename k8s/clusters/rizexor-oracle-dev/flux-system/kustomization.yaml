apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/controllers/base/flux

patches:
  - target:
      kind: HelmRelease
      name: flux-instance
    patch: |-
      - op: add
        path: /spec/values/instance/sync/path
        value: ./k8s/clusters/rizexor-oracle-dev
